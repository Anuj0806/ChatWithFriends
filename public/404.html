<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ChatWithFriends</title>
    <script>
      // Redirect to index.html preserving the path as a hash/query param
      // so React Router can pick it up on load.
      var path = window.location.pathname.slice(1);
      window.location.replace(
        window.location.origin + "/#/" + path + window.location.search
      );
    </script>
  </head>
  <body></body>
</html>
